name: Deploy backend to Azure App Service

# Deploy only production backend changes. Pull requests do not deploy.
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

permissions:
  contents: read

# Do not let two pushes deploy over each other.
concurrency:
  group: azure-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Node 22 matches the Azure App Service runtime selected in the portal.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Build on GitHub, not when Azure wakes from F1 sleep.
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # The generated Prisma client is ignored by Git, so every clean runner
      # must generate it before NestJS compiles files that import it.
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
        env:
          # Generation reads the schema but does not connect to this database.
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"

      - name: Compile NestJS backend
        run: npm run build
        working-directory: backend

      # Keep only dependencies the compiled app needs at runtime.
      - name: Remove development dependencies
        run: npm prune --omit=dev
        working-directory: backend

      - name: Prepare compiled deployment package
        run: |
          mkdir deploy
          cp backend/package.json backend/package-lock.json deploy/
          cp -R backend/dist deploy/dist
          cp -R backend/node_modules deploy/node_modules

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: jm-port
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy
